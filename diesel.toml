# For documentation on how to configure this file,
# see https://diesel.rs/guides/configuring-diesel-cli

[print_schema]
file = "crates/database/src/schema.rs"
custom_type_derives = ["diesel::query_builder::QueryId"]

[migrations_directory]
dir = "migrations"

# SQLite (desktop) backend config lives in its own diesel-sqlite.toml, not a
# keyed [print_schema.sqlite] section here. diesel_cli 2.3's `migration run`
# re-applies *every* keyed section's patch_file on every invocation, not just
# the one matching --schema-key -- and schema_sqlite.rs is committed already
# patched, so that patch can never re-apply cleanly on a second pass. See
# diesel-sqlite.toml and scripts/gen-sqlite-schema.sh.
