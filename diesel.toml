# For documentation on how to configure this file,
# see https://diesel.rs/guides/configuring-diesel-cli

[print_schema]
file = "database/src/schema.rs"
custom_type_derives = ["diesel::query_builder::QueryId"]

[migrations_directory]
dir = "migrations"

# SQLite (desktop) backend. `migrations_directory` takes no keyed variants, so
# the migration dir is passed on the command line. Regenerate with:
#   diesel migration run   --database-url <db> --migration-dir migrations_sqlite
#   diesel print-schema --schema-key sqlite --database-url <db>
#
# The patch file supplies what sqlite introspection cannot: diesel's sqlite
# print-schema has no `TimestamptzSqlite` mapping (it only ever emits
# `Timestamp`, i.e. NaiveDateTime, whereas the models use DateTime<Utc>), and it
# cannot know about the enum mapping types that diesel-derive-enum generates.
[print_schema.sqlite]
file = "database/src/schema_sqlite.rs"
patch_file = "database/src/schema_sqlite.patch"
custom_type_derives = ["diesel::query_builder::QueryId"]
