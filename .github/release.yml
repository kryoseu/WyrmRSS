changelog:
  exclude:
    labels: [skip-changelog]
  categories:
    - title: Features
      labels: [feature]
    - title: Fixes
      labels: [bug]
    - title: Enhancements & Refactors
      labels: [enhancement, refactor]
    - title: Chores
      labels: [chore, dependencies, ci]
    - title: Other
      labels: ["*"]
