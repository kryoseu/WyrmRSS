name: Release

# Single entry point for both kinds of release:
#   - run from the `release` branch  -> stable release, tag vX.Y.Z, pushes
#     docker :latest alongside the version tag, non-prerelease GitHub Release.
#   - run from the `prerelease` branch -> soak-test release, tag
#     vX.Y.Z-rcN (auto-incremented), docker images get only the rc-specific
#     tag so self-hosted users on :latest or a pinned stable tag are
#     unaffected, GitHub Release is marked prerelease.
#
# Either way, docker-release.yml and desktop-release.yml both have to finish
# before the tag and GitHub Release are created, so the release is a single
# atomic artifact rather than docker and desktop landing separately.

on:
  workflow_dispatch:

jobs:
  get-version:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.branch.outputs.mode }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.tag.outputs.tag }}
      docker_version: ${{ steps.tag.outputs.docker_version }}
      is_prerelease: ${{ steps.branch.outputs.is_prerelease }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - name: Check branch
        id: branch
        run: |
          case "${{ github.ref_name }}" in
            release)
              echo "mode=stable" >> "$GITHUB_OUTPUT"
              echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
              ;;
            prerelease)
              echo "mode=prerelease" >> "$GITHUB_OUTPUT"
              echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "This workflow must be run from 'release' or 'prerelease' (got '${{ github.ref_name }}')"
              exit 1
              ;;
          esac
      - uses: actions/checkout@v7.0.1
      - name: Get version
        id: version
        run: |
          version=$(grep '^version = "' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          desktop_version=$(grep '^version = "' desktop/src-tauri/Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          if [ "$version" != "$desktop_version" ]; then
            echo "Cargo.toml is at $version but desktop/src-tauri/Cargo.toml is at $desktop_version."
            echo "Run scripts/bump-version.sh to keep them in sync, then merge and retry."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Compute tag
        id: tag
        run: |
          version="${{ steps.version.outputs.version }}"
          if git ls-remote --tags origin | grep -q "refs/tags/v${version}$"; then
            if [ "${{ steps.branch.outputs.mode }}" = "stable" ]; then
              echo "Tag v${version} already exists. Bump the version in Cargo.toml on main and merge to release first."
              exit 1
            else
              echo "v${version} was already released as stable. Bump the version before cutting another prerelease."
              exit 1
            fi
          fi

          if [ "${{ steps.branch.outputs.mode }}" = "stable" ]; then
            echo "tag=v${version}" >> "$GITHUB_OUTPUT"
            echo "docker_version=${version}" >> "$GITHUB_OUTPUT"
          else
            last_rc=$(git ls-remote --tags origin \
              | grep -oE "refs/tags/v${version}-rc[0-9]+$" \
              | grep -oE '[0-9]+$' \
              | sort -n | tail -1)
            next_rc=$(( ${last_rc:-0} + 1 ))
            echo "tag=v${version}-rc${next_rc}" >> "$GITHUB_OUTPUT"
            echo "docker_version=${version}-rc${next_rc}" >> "$GITHUB_OUTPUT"
          fi

  docker-release:
    needs: [get-version]
    uses: ./.github/workflows/docker-release.yml
    permissions:
      contents: read
      packages: write
    with:
      sha: ${{ needs.get-version.outputs.sha }}
      version: ${{ needs.get-version.outputs.docker_version }}
      is_prerelease: ${{ needs.get-version.outputs.is_prerelease == 'true' }}

  desktop-release:
    needs: [get-version]
    uses: ./.github/workflows/desktop-release.yml
    with:
      sha: ${{ needs.get-version.outputs.sha }}

  publish-release:
    needs: [get-version, docker-release, desktop-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.get-version.outputs.sha }}
      - name: Download desktop artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          path: artifacts
      - name: Tag & Release
        uses: softprops/action-gh-release@v3.0.2
        with:
          tag_name: ${{ needs.get-version.outputs.tag }}
          name: ${{ needs.get-version.outputs.tag }}
          target_commitish: ${{ needs.get-version.outputs.sha }}
          prerelease: ${{ needs.get-version.outputs.is_prerelease == 'true' }}
          draft: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: artifacts/**/*
