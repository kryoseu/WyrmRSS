name: Release
on:
  workflow_dispatch:

jobs:
  get-version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.get.outputs.version }}
      sha: ${{ steps.get.outputs.sha }}
    steps:
      - name: Check branch
        run: |
          if [ "${{ github.ref_name }}" != "release" ]; then
            echo "This workflow must be run from the 'release' branch (got '${{ github.ref_name }}')"
            exit 1
          fi
      - uses: actions/checkout@v6
      - name: Get version
        id: get
        run: |
          VERSION=$(grep '^version = ' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
      - name: Check tag does not exist
        run: |
          if git ls-remote --tags origin | grep -q "refs/tags/v${{ steps.get.outputs.version }}$"; then
            echo "Tag v${{ steps.get.outputs.version }} already exists. Bump the version in Cargo.toml on main and merge to release first."
            exit 1
          fi

  build-backend:
    needs: [get-version]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.get-version.outputs.sha }}
      - name: Install nightly rustfmt
        run: rustup toolchain install nightly --component rustfmt --no-self-update
      - name: Format check
        run: cargo +nightly fmt --check
      - name: Clippy
        run: cargo clippy -- -D warnings
      - name: Build
        run: cargo build --verbose
      - name: Test
        run: cargo test --verbose

  build-frontend:
    needs: [get-version]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.get-version.outputs.sha }}
      - uses: pnpm/action-setup@v6
        with:
          version: latest
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: Lint
        working-directory: web
        run: pnpm lint
      - name: Build
        working-directory: web
        run: pnpm run build

  push-backend:
    needs: [build-backend, get-version]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.get-version.outputs.sha }}
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/wyrm-server:latest
            ghcr.io/${{ github.repository_owner }}/wyrm-server:${{ needs.get-version.outputs.version }}

  push-frontend:
    needs: [build-frontend, get-version]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.get-version.outputs.sha }}
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: ./web
          file: ./web/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/wyrm-ui:latest
            ghcr.io/${{ github.repository_owner }}/wyrm-ui:${{ needs.get-version.outputs.version }}

  release:
    needs: [push-backend, push-frontend, get-version]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.get-version.outputs.sha }}
      - name: Tag & Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.get-version.outputs.version }}
          name: v${{ needs.get-version.outputs.version }}
          target_commitish: ${{ needs.get-version.outputs.sha }}
          generate_release_notes: true
