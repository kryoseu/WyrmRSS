name: Release
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump type
        required: true
        default: patch
        type: choice
        options: [patch, minor, major]

jobs:
  bump-version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      version: ${{ steps.bump.outputs.version }}
    steps:
      - name: Check branch
        run: |
          if [ "${{ github.ref_name }}" != "release" ]; then
            echo "This workflow must be run from the 'release' branch (got '${{ github.ref_name }}')"
            exit 1
          fi
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Bump version
        id: bump
        run: |
          CURRENT=$(grep '^version = ' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          case "${{ inputs.bump }}" in
            major) MAJOR=$((MAJOR+1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR+1)); PATCH=0 ;;
            patch) PATCH=$((PATCH+1)) ;;
          esac
          NEW="$MAJOR.$MINOR.$PATCH"
          sed -i "s/^version = \"$CURRENT\"/version = \"$NEW\"/" Cargo.toml
          echo "version=$NEW" >> $GITHUB_OUTPUT
      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml
          git commit -m "Release ${{ steps.bump.outputs.version }}"
          git push
      - name: Sync version to main via PR
        run: |
          git fetch origin main
          git checkout -b sync-version-${{ steps.bump.outputs.version }} origin/main
          sed -i "s/^version = \".*\"/version = \"${{ steps.bump.outputs.version }}\"/" Cargo.toml
          git add Cargo.toml
          git commit -m "Release ${{ steps.bump.outputs.version }}"
          git push origin sync-version-${{ steps.bump.outputs.version }}
          gh pr create \
            --title "Release ${{ steps.bump.outputs.version }}" \
            --body "Automated version sync from release workflow." \
            --base main \
            --head sync-version-${{ steps.bump.outputs.version }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-backend:
    needs: [bump-version]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
      - name: Build
        run: cargo build --verbose
      - name: Test
        run: cargo test --verbose

  build-frontend:
    needs: [bump-version]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
      - uses: pnpm/action-setup@v6
        with:
          version: latest
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install & Build
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

  push-backend:
    needs: [build-backend, bump-version]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/wyrm-server:latest
            ghcr.io/${{ github.repository_owner }}/wyrm-server:${{ needs.bump-version.outputs.version }}

  push-frontend:
    needs: [build-frontend, bump-version]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: ./web
          file: ./web/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/wyrm-ui:latest
            ghcr.io/${{ github.repository_owner }}/wyrm-ui:${{ needs.bump-version.outputs.version }}

  release:
    needs: [push-backend, push-frontend, bump-version]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
      - name: Tag & Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.bump-version.outputs.version }}
          name: v${{ needs.bump-version.outputs.version }}
          generate_release_notes: true
