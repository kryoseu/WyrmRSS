name: Desktop Release

# Build-only: this is called by release.yml, which downloads the uploaded
# artifacts from every platform and attaches them to the single tagged
# GitHub Release once docker-release.yml has also finished, so the release
# is created atomically instead of piecemeal per workflow.

on:
  workflow_call:
    inputs:
      sha:
        description: Commit to build
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop/src-tauri
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.sha }}
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev \
            libssl-dev
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install nightly rustfmt
        run: rustup toolchain install nightly --component rustfmt --no-self-update
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2.9.1
        with:
          workspaces: desktop/src-tauri
      - name: Format check
        run: cargo +nightly fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Machete
        uses: bnjbvr/cargo-machete@v0.9.2
        with:
          args: desktop/src-tauri

  build:
    needs: [lint]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            name: macos-aarch64
            target: aarch64-apple-darwin
            args: "--target aarch64-apple-darwin"
            bundle: desktop/src-tauri/target/aarch64-apple-darwin/release/bundle
          - platform: macos-latest
            name: macos-x86_64
            target: x86_64-apple-darwin
            args: "--target x86_64-apple-darwin"
            bundle: desktop/src-tauri/target/x86_64-apple-darwin/release/bundle
          - platform: windows-latest
            name: windows
            target: ""
            args: ""
            bundle: desktop/src-tauri/target/release/bundle
          - platform: ubuntu-22.04
            name: linux
            target: ""
            args: ""
            bundle: desktop/src-tauri/target/release/bundle

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.sha }}

      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libfuse2 \
            rpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add macOS target
        if: matrix.target != ''
        run: rustup target add ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2.9.1
        with:
          workspaces: desktop/src-tauri
          key: ${{ matrix.name }}

      - uses: pnpm/action-setup@v6.0.9
        with:
          version: 11.7.0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v1.0.0
        with:
          projectPath: desktop
          args: ${{ matrix.args }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: wyrm-desktop-${{ matrix.name }}
          path: |
            ${{ matrix.bundle }}/dmg/*.dmg
            ${{ matrix.bundle }}/nsis/*.exe
            ${{ matrix.bundle }}/deb/*.deb
            ${{ matrix.bundle }}/rpm/*.rpm
            ${{ matrix.bundle }}/appimage/*.AppImage
          if-no-files-found: ignore
