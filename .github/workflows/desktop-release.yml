name: Desktop Release

on:
  push:
    tags: ["desktop-v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Fixed, known-in-advance PQ_LIB_DIR per platform (GH-hosted
          # macos-latest is always arm64 Homebrew at /opt/homebrew; the
          # Windows path is choco's fixed install location). Set as a
          # job-level env below instead of an in-step `>> $GITHUB_ENV`
          # write — that runtime propagation was not reliably reaching the
          # pq-sys build script (linker errors showed no -L search path at
          # all, only a bare -lpq).
          - platform: macos-latest
            pq_lib_dir: /opt/homebrew/opt/libpq/lib
          - platform: windows-latest
            pq_lib_dir: 'C:\Program Files\PostgreSQL\14\lib'
          - platform: ubuntu-latest
            pq_lib_dir: ""
    runs-on: ${{ matrix.platform }}
    env:
      PQ_LIB_DIR: ${{ matrix.pq_lib_dir }}
    steps:
      - uses: actions/checkout@v7.0.0

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf build-essential \
            curl wget file libxdo-dev libssl-dev libfuse2 rpm

      - name: Install libpq (macOS)
        if: matrix.platform == 'macos-latest'
        run: brew install libpq

      # Same approach diesel-rs's own CI uses for this exact linker error.
      - name: Install libpq (Windows)
        if: matrix.platform == 'windows-latest'
        run: choco install postgresql14 --force --params '/Password:root'

      - name: Verify libpq install
        if: matrix.platform != 'ubuntu-latest'
        shell: bash
        run: |
          echo "PQ_LIB_DIR=$PQ_LIB_DIR"
          ls -la "$PQ_LIB_DIR"

      - uses: pnpm/action-setup@v6.0.9
        with:
          version: 11.7.0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: web

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PQ_LIB_DIR: ${{ matrix.pq_lib_dir }}
        with:
          projectPath: desktop
          # Manual workflow_dispatch runs (no tag) omit these and just build,
          # per tauri-action's build-only mode; tag pushes create a draft
          # GitHub release with the artifacts attached.
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: "Wyrm Desktop ${{ github.ref_type == 'tag' && github.ref_name || '' }}"
          releaseDraft: true
          prerelease: false

      # Lets a manual (untagged) run download the built installer from the
      # Actions run page even though no GitHub release was created for it.
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wyrm-desktop-${{ matrix.platform }}
          path: |
            target/release/bundle/dmg/*.dmg
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/bundle/appimage/*.AppImage
          if-no-files-found: ignore
