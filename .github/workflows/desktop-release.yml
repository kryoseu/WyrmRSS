name: Desktop Release

on:
  push:
    tags: ["desktop-v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
          - platform: windows-latest
          - platform: ubuntu-latest

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v7.0.0

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libfuse2 \
            rpm \
            libpq-dev \
            pkg-config

      - name: Install libpq (macOS)
        if: matrix.platform == 'macos-latest'
        shell: bash
        run: |
          brew install libpq

          LIBPQ_PREFIX="$(brew --prefix libpq)"

          echo "PQ_LIB_DIR=$LIBPQ_PREFIX/lib" >> "$GITHUB_ENV"
          echo "LIBPQ_LIB_DIR=$LIBPQ_PREFIX/lib" >> "$GITHUB_ENV"

          echo "libpq prefix:"
          echo "$LIBPQ_PREFIX"

          ls -la "$LIBPQ_PREFIX/lib"

      - name: Install libpq (Windows)
        if: matrix.platform == 'windows-latest'
        shell: powershell
        run: |
          choco install postgresql14 --force --params '/Password:root'

          echo "PQ_LIB_DIR=C:\Program Files\PostgreSQL\14\lib" >> $env:GITHUB_ENV
          echo "PQ_LIB_NAME=libpq" >> $env:GITHUB_ENV

          Get-ChildItem "C:\Program Files\PostgreSQL\14\lib"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: pnpm/action-setup@v6.0.9
        with:
          version: 11.7.0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: web

      - name: Verify libpq
        shell: bash
        run: |
          echo "PQ_LIB_DIR=$PQ_LIB_DIR"
          echo "LIBPQ_LIB_DIR=$LIBPQ_LIB_DIR"

          if [ "${{ matrix.platform }}" = "macos-latest" ]; then
            ls -la "$PQ_LIB_DIR"
            test -f "$PQ_LIB_DIR/libpq.dylib"
          fi

      - uses: tauri-apps/tauri-action@v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PQ_LIB_DIR: ${{ env.PQ_LIB_DIR }}
          LIBPQ_LIB_DIR: ${{ env.LIBPQ_LIB_DIR }}
        with:
          projectPath: desktop
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: "Wyrm Desktop ${{ github.ref_type == 'tag' && github.ref_name || '' }}"
          releaseDraft: true
          prerelease: false

      - name: Upload artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: wyrm-desktop-${{ matrix.platform }}
          path: |
            desktop/target/release/bundle/dmg/*.dmg
            desktop/target/release/bundle/msi/*.msi
            desktop/target/release/bundle/nsis/*.exe
            desktop/target/release/bundle/deb/*.deb
            desktop/target/release/bundle/rpm/*.rpm
            desktop/target/release/bundle/appimage/*.AppImage
          if-no-files-found: ignore
