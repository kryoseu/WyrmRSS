name: Desktop Release

on:
  push:
    tags:
      - "desktop-v*"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            name: macos-aarch64
            target: aarch64-apple-darwin
            args: "--target aarch64-apple-darwin"
            bundle: desktop/src-tauri/target/aarch64-apple-darwin/release/bundle
          - platform: macos-latest
            name: macos-x86_64
            target: x86_64-apple-darwin
            args: "--target x86_64-apple-darwin"
            bundle: desktop/src-tauri/target/x86_64-apple-darwin/release/bundle
          - platform: windows-latest
            name: windows
            target: ""
            args: ""
            bundle: desktop/src-tauri/target/release/bundle
          - platform: ubuntu-22.04
            name: linux
            target: ""
            args: ""
            bundle: desktop/src-tauri/target/release/bundle

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libfuse2 \
            rpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add macOS target
        if: matrix.target != ''
        run: rustup target add ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2.9.1
        with:
          workspaces: desktop/src-tauri
          key: ${{ matrix.name }}

      - uses: pnpm/action-setup@v6.0.9
        with:
          version: 11.7.0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v1.0.0
        with:
          projectPath: desktop
          args: ${{ matrix.args }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: wyrm-desktop-${{ matrix.name }}
          path: |
            ${{ matrix.bundle }}/dmg/*.dmg
            ${{ matrix.bundle }}/nsis/*.exe
            ${{ matrix.bundle }}/deb/*.deb
            ${{ matrix.bundle }}/rpm/*.rpm
            ${{ matrix.bundle }}/appimage/*.AppImage
          if-no-files-found: ignore

  release:
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          path: artifacts

      - name: Create draft release
        uses: softprops/action-gh-release@v3.0.2
        with:
          draft: true
          prerelease: true
          name: ${{ github.ref_name }}
          files: artifacts/**/*
          fail_on_unmatched_files: true
