name: Desktop Release

on:
  push:
    tags: ["desktop-v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
          - platform: windows-latest
          - platform: ubuntu-latest

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v7.0.0

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libfuse2 \
            rpm \
            libpq-dev \
            pkg-config

      - name: Install libpq (macOS)
        if: matrix.platform == 'macos-latest'
        run: |
          brew install libpq pkg-config

          echo "$(brew --prefix libpq)/bin" >> $GITHUB_PATH
          echo "PKG_CONFIG_PATH=$(brew --prefix libpq)/lib/pkgconfig" >> $GITHUB_ENV
          echo "LDFLAGS=-L$(brew --prefix libpq)/lib" >> $GITHUB_ENV
          echo "LIBRARY_PATH=$(brew --prefix libpq)/lib" >> $GITHUB_ENV

          echo "libpq location:"
          brew --prefix libpq
          ls -la "$(brew --prefix libpq)/lib"

      - name: Install libpq (Windows)
        if: matrix.platform == 'windows-latest'
        shell: powershell
        run: |
          choco install postgresql14 --force --params '/Password:root'

          echo "PQ_LIB_DIR=C:\Program Files\PostgreSQL\14\lib" >> $env:GITHUB_ENV
          echo "PQ_LIB_NAME=libpq" >> $env:GITHUB_ENV

          Get-ChildItem "C:\Program Files\PostgreSQL\14\lib"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: pnpm/action-setup@v6.0.9
        with:
          version: 11.7.0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: web

      - name: Verify environment
        shell: bash
        run: |
          echo "LDFLAGS=$LDFLAGS"
          echo "LIBRARY_PATH=$LIBRARY_PATH"
          echo "PKG_CONFIG_PATH=$PKG_CONFIG_PATH"

          if command -v pkg-config; then
            pkg-config --libs libpq || true
          fi

      - uses: tauri-apps/tauri-action@v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LDFLAGS: ${{ env.LDFLAGS }}
          LIBRARY_PATH: ${{ env.LIBRARY_PATH }}
          PKG_CONFIG_PATH: ${{ env.PKG_CONFIG_PATH }}
          PQ_LIB_DIR: ${{ env.PQ_LIB_DIR }}
          PQ_LIB_NAME: ${{ env.PQ_LIB_NAME }}
        with:
          projectPath: desktop
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: "Wyrm Desktop ${{ github.ref_type == 'tag' && github.ref_name || '' }}"
          releaseDraft: true
          prerelease: false

      - name: Upload artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: wyrm-desktop-${{ matrix.platform }}
          path: |
            desktop/target/release/bundle/dmg/*.dmg
            desktop/target/release/bundle/msi/*.msi
            desktop/target/release/bundle/nsis/*.exe
            desktop/target/release/bundle/deb/*.deb
            desktop/target/release/bundle/rpm/*.rpm
            desktop/target/release/bundle/appimage/*.AppImage
          if-no-files-found: ignore
