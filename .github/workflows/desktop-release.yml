name: Desktop Build Test

on:
  push:
    tags:
      - "desktop-v*"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
          - platform: windows-latest
          - platform: ubuntu-latest

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v7.0.0

      # Linux dependencies
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libfuse2 \
            rpm \
            libpq-dev \
            pkg-config

      # macOS libpq
      - name: Install libpq (macOS)
        if: matrix.platform == 'macos-latest'
        shell: bash
        run: |
          brew install libpq

          LIBPQ_PREFIX="$(brew --prefix libpq)"

          # export for use later in *this* step (e.g. the pkg-config calls
          # below) — writing to $GITHUB_ENV alone only affects later steps.
          export PQ_LIB_DIR="$LIBPQ_PREFIX/lib"
          export PQ_LIB_NAME=pq
          # Link libpq statically — otherwise the app dynamically links
          # against this CI runner's own Homebrew keg
          # (/opt/homebrew/opt/libpq/lib/libpq.5.dylib), and every user
          # without that exact keg installed gets "Library not loaded" at
          # launch.
          export PQ_LIB_STATIC=1
          export PKG_CONFIG_PATH="$LIBPQ_PREFIX/lib/pkgconfig"
          export LDFLAGS="-L$LIBPQ_PREFIX/lib"
          export LIBRARY_PATH="$LIBPQ_PREFIX/lib"
          # libpq.a alone is missing SCRAM/string/random helpers that live in
          # libpgcommon.a and libpgport.a (also shipped by the libpq keg) —
          # pq-sys only links the lib named by PQ_LIB_NAME, so pull these in
          # explicitly or the final link fails with undefined symbols.
          export RUSTFLAGS="-L $LIBPQ_PREFIX/lib -l static=pgcommon -l static=pgport"

          echo "PQ_LIB_DIR=$PQ_LIB_DIR" >> "$GITHUB_ENV"
          echo "PQ_LIB_NAME=$PQ_LIB_NAME" >> "$GITHUB_ENV"
          echo "PQ_LIB_STATIC=$PQ_LIB_STATIC" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=$PKG_CONFIG_PATH" >> "$GITHUB_ENV"
          echo "LDFLAGS=$LDFLAGS" >> "$GITHUB_ENV"
          echo "LIBRARY_PATH=$LIBRARY_PATH" >> "$GITHUB_ENV"
          echo "RUSTFLAGS=$RUSTFLAGS" >> "$GITHUB_ENV"

          echo "libpq prefix:"
          echo "$LIBPQ_PREFIX"

          ls -la "$LIBPQ_PREFIX/lib"
          ls -la "$LIBPQ_PREFIX/lib/pkgconfig"

          pkg-config --libs libpq
          pkg-config --cflags libpq

      # Windows libpq
      - name: Install libpq (Windows)
        if: matrix.platform == 'windows-latest'
        shell: powershell
        run: |
          choco install postgresql14 --force --params '/Password:root'

          echo "PQ_LIB_DIR=C:\Program Files\PostgreSQL\14\lib" >> $env:GITHUB_ENV
          echo "PQ_LIB_NAME=pq" >> $env:GITHUB_ENV
          echo "PQ_LIB_STATIC=0" >> $env:GITHUB_ENV

          Get-ChildItem "C:\Program Files\PostgreSQL\14\lib"
          Get-ChildItem "C:\Program Files\PostgreSQL\14\include"

          # pq-sys only supports dynamic linking on MSVC, so libpq.dll (and
          # whatever it depends on — libcrypto/libssl/libintl/iconv from the
          # choco Postgres install) has to ship next to the exe or the app
          # fails at launch with "couldn't find libpq.dll". Copying every DLL
          # from the Postgres bin dir is a superset but harmless — bundled as
          # a Tauri resource via tauri.windows.conf.json.
          $dest = "desktop\src-tauri\resources-windows"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Copy-Item "C:\Program Files\PostgreSQL\14\bin\*.dll" -Destination $dest
          Get-ChildItem $dest

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: pnpm/action-setup@v6.0.9
        with:
          version: 11.7.0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Verify environment
        shell: bash
        run: |
          echo "Platform: ${{ matrix.platform }}"
          echo "PQ_LIB_DIR=$PQ_LIB_DIR"
          echo "PQ_LIB_NAME=$PQ_LIB_NAME"
          echo "PKG_CONFIG_PATH=$PKG_CONFIG_PATH"
          echo "LDFLAGS=$LDFLAGS"
          echo "LIBRARY_PATH=$LIBRARY_PATH"

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v1.0.0
        with:
          projectPath: desktop

      - name: Upload artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: wyrm-desktop-${{ matrix.platform }}
          path: |
            target/release/bundle/dmg/*.dmg
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/bundle/appimage/*.AppImage
          if-no-files-found: ignore
