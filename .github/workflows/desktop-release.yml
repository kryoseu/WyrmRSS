name: Desktop Release

on:
  push:
    tags: ["desktop-v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
          - platform: windows-latest
          - platform: ubuntu-latest
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7.0.0

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf build-essential \
            curl wget file libxdo-dev libssl-dev libfuse2 rpm

      - name: Install libpq (macOS)
        if: matrix.platform == 'macos-latest'
        run: |
          brew install libpq
          echo "PQ_LIB_DIR=$(brew --prefix libpq)/lib" >> "$GITHUB_ENV"

      # Same approach diesel-rs's own CI uses for this exact linker error.
      - name: Install libpq (Windows)
        if: matrix.platform == 'windows-latest'
        run: |
          choco install postgresql14 --force --params '/Password:root'
          echo "PQ_LIB_DIR=C:\Program Files\PostgreSQL\14\lib" >> $env:GITHUB_ENV

      - uses: pnpm/action-setup@v6.0.9
        with:
          version: 11.7.0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: web

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          # Manual workflow_dispatch runs (no tag) omit these and just build,
          # per tauri-action's build-only mode; tag pushes create a draft
          # GitHub release with the artifacts attached.
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: "Wyrm Desktop ${{ github.ref_type == 'tag' && github.ref_name || '' }}"
          releaseDraft: true
          prerelease: false

      # Lets a manual (untagged) run download the built installer from the
      # Actions run page even though no GitHub release was created for it.
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wyrm-desktop-${{ matrix.platform }}
          path: |
            target/release/bundle/dmg/*.dmg
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/bundle/appimage/*.AppImage
          if-no-files-found: ignore
