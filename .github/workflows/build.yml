name: Build

on:
  push:
    branches: ["main", "release"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: dorny/paths-filter@v4.0.1
        id: filter
        with:
          filters: |
            backend:
              - '**/*.rs'
              - '**/Cargo.toml'
              - 'Cargo.lock'
              - 'migrations/**'
            frontend:
              - 'web/**'

  backend:
    needs: [changes]
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: wyrm
          POSTGRES_PASSWORD: wyrm
          POSTGRES_DB: wyrm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wyrm"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7.0.0
      - name: Install nightly rustfmt
        run: rustup toolchain install nightly --component rustfmt --no-self-update
      - name: Format check
        run: cargo +nightly fmt --check
      - name: Clippy
        run: cargo clippy -- -D warnings
      - name: Machete
        uses: bnjbvr/cargo-machete@v0.9.2
      - name: Build
        run: cargo build --verbose
      - name: Test
        run: cargo test --verbose
        env:
          WYRM_DATABASE_CONNECTION: postgres://wyrm:wyrm@localhost:5432/wyrm

  frontend:
    needs: [changes]
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: pnpm/action-setup@v6.0.9
        with:
          version: latest
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
        working-directory: web
      - name: Lint
        run: pnpm lint
        working-directory: web
      - name: Build
        run: pnpm run build
        working-directory: web
