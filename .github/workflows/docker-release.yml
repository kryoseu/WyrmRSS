name: Docker Release

on:
  workflow_call:
    inputs:
      sha:
        description: Commit to build and release
        required: true
        type: string
      version:
        description: Docker tag, without a leading 'v' (e.g. 0.26.0 or 0.26.0-rc1)
        required: true
        type: string
      is_prerelease:
        description: When true, images are tagged with `version` only -- `:latest` is never touched
        required: true
        type: boolean

env:
  # Skip buildx's per-build .dockerbuild summary artifact.
  DOCKER_BUILD_SUMMARY: false

jobs:
  build-backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: wyrm
          POSTGRES_PASSWORD: wyrm
          POSTGRES_DB: wyrm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wyrm"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.sha }}
      - name: Install nightly rustfmt
        run: rustup toolchain install nightly --component rustfmt --no-self-update
      - name: Format check
        run: cargo +nightly fmt --check
      - name: Clippy
        run: cargo clippy -- -D warnings
      - name: Machete
        uses: bnjbvr/cargo-machete@v0.9.2
      - name: Build
        run: cargo build --verbose
      - name: Test
        run: cargo test --verbose
        env:
          WYRM_DATABASE_CONNECTION: postgres://wyrm:wyrm@localhost:5432/wyrm

  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.sha }}
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 11.7.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: Lint
        working-directory: web
        run: pnpm lint
      - name: Build
        working-directory: web
        run: pnpm run build

  build-backend-image:
    needs: [build-backend]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            platform_id: linux-amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            platform_id: linux-arm64
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.sha }}
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,"name=ghcr.io/${{ github.repository_owner }}/wyrm-server",push-by-digest=true,name-canonical=true,push=true
      - name: Export digest
        run: |
          mkdir -p ${{ runner.temp }}/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"
      - name: Upload digest artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: digests-backend-${{ matrix.platform_id }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  push-backend:
    needs: [build-backend-image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-backend-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create manifest list and push
        run: |
          tag_args=("-t" "ghcr.io/${{ github.repository_owner }}/wyrm-server:${{ inputs.version }}")
          if [ "${{ inputs.is_prerelease }}" = "false" ]; then
            tag_args+=("-t" "ghcr.io/${{ github.repository_owner }}/wyrm-server:latest")
          fi

          sources=()
          for f in ${{ runner.temp }}/digests/*; do
            sources+=("ghcr.io/${{ github.repository_owner }}/wyrm-server@sha256:$(basename "$f")")
          done

          docker buildx imagetools create "${tag_args[@]}" "${sources[@]}"
      - name: Inspect image
        run: |
          docker buildx imagetools inspect "ghcr.io/${{ github.repository_owner }}/wyrm-server:${{ inputs.version }}"

  build-frontend-image:
    needs: [build-frontend]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            platform_id: linux-amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            platform_id: linux-arm64
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.sha }}
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7.4.0
        with:
          context: ./web
          file: ./web/Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,"name=ghcr.io/${{ github.repository_owner }}/wyrm-ui",push-by-digest=true,name-canonical=true,push=true
      - name: Export digest
        run: |
          mkdir -p ${{ runner.temp }}/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"
      - name: Upload digest artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: digests-frontend-${{ matrix.platform_id }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  push-frontend:
    needs: [build-frontend-image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-frontend-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create manifest list and push
        run: |
          tag_args=("-t" "ghcr.io/${{ github.repository_owner }}/wyrm-ui:${{ inputs.version }}")
          if [ "${{ inputs.is_prerelease }}" = "false" ]; then
            tag_args+=("-t" "ghcr.io/${{ github.repository_owner }}/wyrm-ui:latest")
          fi

          sources=()
          for f in ${{ runner.temp }}/digests/*; do
            sources+=("ghcr.io/${{ github.repository_owner }}/wyrm-ui@sha256:$(basename "$f")")
          done

          docker buildx imagetools create "${tag_args[@]}" "${sources[@]}"
      - name: Inspect image
        run: |
          docker buildx imagetools inspect "ghcr.io/${{ github.repository_owner }}/wyrm-ui:${{ inputs.version }}"
