[package]
name = "api_routes"
version.workspace = true
edition.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
actix-web = { workspace = true }
api_api = { path = "../api", default-features = false }
api_crud = { path = "../crud", default-features = false }
auth = { path = "../../auth", default-features = false, optional = true }

[features]
default = ["postgres"]
auth = ["dep:auth"]
postgres = ["api_api/postgres", "api_crud/postgres", "auth?/postgres"]
sqlite = ["api_api/sqlite", "api_crud/sqlite", "auth?/sqlite"]

[dev-dependencies]
serde_json = { workspace = true }
wyrm_utils = { path = "../../utils" }
