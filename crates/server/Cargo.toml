[package]
name = "server"
version.workspace = true
edition.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
tokio = { workspace = true }
actix-web = { workspace = true, features = ["secure-cookies"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
api_routes = { path = "../api/routes", default-features = false }
api_utils = { path = "../api/utils", default-features = false }
database = { path = "../database", default-features = false }
wyrm_utils = { path = "../utils" }
wyrm-rss = { path = "../rss", default-features = false }
openidconnect = { version = "4.1.0", features = ["timing-resistant-secret-traits"] }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
sha2 = { workspace = true }

# Backend selection for the whole tree lands here. `cargo run` keeps postgres;
# the desktop build uses `--no-default-features --features sqlite`. Not
# documented as a deployment option -- sqlite exists for the desktop app.
[features]
default = ["postgres"]
postgres = [
  "database/postgres",
  "api_routes/postgres",
  "api_utils/postgres",
  "wyrm-rss/postgres",
]
sqlite = [
  "database/sqlite",
  "api_routes/sqlite",
  "api_utils/sqlite",
  "wyrm-rss/sqlite",
]
