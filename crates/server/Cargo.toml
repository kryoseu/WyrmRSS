[package]
name = "server"
version.workspace = true
edition.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
tokio = { workspace = true }
actix-web = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
api_routes = { path = "../api/routes", default-features = false }
wyrm_auth = { path = "../auth", default-features = false }
api_utils = { path = "../api/utils", default-features = false }
database = { path = "../database", default-features = false }
wyrm_utils = { path = "../utils" }
wyrm-rss = { path = "../rss", default-features = false }

# Backend selection for the whole tree lands here. `cargo run` keeps postgres;
# the desktop build uses `--no-default-features --features sqlite`. Not
# documented as a deployment option -- sqlite exists for the desktop app.
[features]
default = ["postgres", "oidc"]
oidc = ["api_routes/oidc", "wyrm_auth/oidc"]
postgres = [
  "database/postgres",
  "api_routes/postgres",
  "api_utils/postgres",
  "wyrm_auth/postgres",
  "wyrm-rss/postgres",
]
sqlite = [
  "database/sqlite",
  "api_routes/sqlite",
  "api_utils/sqlite",
  "wyrm_auth/sqlite",
  "wyrm-rss/sqlite",
]
